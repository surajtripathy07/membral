# Builds the self-hosted cloud image (apps/cloud/Dockerfile) and publishes it to
# GHCR. Publishing is off until the repo variable PUBLISH_IMAGE is set to 'true'
# (Settings > Secrets and variables > Actions > Variables), so merging this
# workflow publishes nothing.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: vars.PUBLISH_IMAGE == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/cloud/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/surajtripathy07/membral-cloud:${{ github.sha }}
            ghcr.io/surajtripathy07/membral-cloud:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
