# Copies the third-party images in .github/base-images.txt to GHCR
# (ghcr.io/<owner>/membral-mirror-<name>) with the workflow's own GITHUB_TOKEN.
# CI and the image publish pull from there, logged in, so a 429 from
# public.ecr.aws or Docker Hub on the shared runner IPs does not fail them.
# Weekly, so moving tags (node:20-bookworm-slim) pick up upstream fixes; an
# image whose mirror already has the upstream digest is skipped. A PR that
# changes the list runs only the read-only `check` job; nothing is written to
# the mirror until the change reaches main.
name: mirror base images

on:
  push:
    branches: [main]
    paths:
      - .github/base-images.txt
      - .github/workflows/mirror-base-images.yml
      - scripts/ci/base-images.sh
  pull_request:
    paths:
      - .github/base-images.txt
      - .github/workflows/mirror-base-images.yml
      - scripts/ci/base-images.sh
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-base-images
  cancel-in-progress: false

jobs:
  # PRs: read-only. The list must cover every image in use, and each listed
  # image must answer from the mirror or an upstream source.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the list covers every image in use
        run: bash scripts/ci/base-images.sh check
      - name: Resolve every listed image (read-only)
        env:
          MIRROR_OWNER: ${{ github.repository_owner }}
        run: |
          grep -vE '^[[:space:]]*(#|$)' .github/base-images.txt | awk '{print $1}' | while read -r name; do
            echo "$name: $(bash scripts/ci/base-images.sh resolve "$name")"
          done

  # main, the weekly schedule and manual runs on main: the only writers.
  mirror:
    if: github.repository == 'surajtripathy07/membral' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # No setup-buildx: imagetools runs on the default builder, so this job
      # pulls no buildkit image from Docker Hub.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the list covers every image in use
        run: bash scripts/ci/base-images.sh check
      - name: Mirror
        env:
          MIRROR_OWNER: ${{ github.repository_owner }}
        run: bash scripts/ci/base-images.sh mirror
