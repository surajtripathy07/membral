<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Membral</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      padding: 16px;
    }
    .header {
      margin-bottom: 16px;
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      color: #6366f1;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tagline {
      font-size: 12px;
      color: #666;
      margin-top: 2px;
    }
    .provider-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
      transition: border-color 0.15s;
    }
    .provider-card:hover {
      border-color: #3a3a3a;
    }
    .provider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .provider-name-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .provider-logo {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: #fff;
      flex-shrink: 0;
    }
    .logo-claude { background: #d97706; }
    .logo-chatgpt { background: #10a37f; }
    .provider-name {
      font-weight: 600;
      font-size: 14px;
      color: #fff;
    }
    .provider-status {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
    }
    .status-success { background: #1a3a1a; color: #4ade80; }
    .status-success .status-dot { background: #4ade80; }
    .status-error { background: #3a1a1a; color: #f87171; }
    .status-error .status-dot { background: #f87171; }
    .status-syncing { background: #1a2a3a; color: #60a5fa; }
    .status-syncing .status-dot { background: #60a5fa; }
    .status-never { background: #2a2a2a; color: #888; }
    .status-never .status-dot { background: #888; }
    .status-skipped { background: #2a2a1a; color: #fbbf24; }
    .status-skipped .status-dot { background: #fbbf24; }
    /* MN3 fix (adversarial review): "cancelled" had a label in popup.ts's
       statusLabels map but no matching CSS class, so it silently fell back
       to unstyled text -- muted/amber, matching the existing skipped
       palette (a cancelled sync is a similarly non-error, non-success
       in-between state). */
    .status-cancelled { background: #2a2a1a; color: #fbbf24; }
    .status-cancelled .status-dot { background: #fbbf24; }
    .provider-count {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      line-height: 1;
    }
    .provider-count-label {
      font-size: 12px;
      color: #888;
      margin-top: 2px;
    }
    .provider-meta {
      font-size: 11px;
      color: #666;
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .provider-meta span { color: #999; }
    .provider-error {
      font-size: 11px;
      color: #f87171;
      margin-top: 4px;
    }

    /* Auth Section */
    .auth-section {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 10px 12px;
      margin-top: 12px;
    }
    .auth-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .auth-bar-left {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #888;
    }
    .auth-bar-left .status-dot {
      flex-shrink: 0;
    }
    .auth-badge {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 5px;
      background: #1a3a1a;
      color: #4ade80;
    }
    .auth-badge-disconnected {
      background: #2a2a2a;
      color: #888;
    }
    .auth-email {
      font-size: 12px;
      color: #bbb;
    }
    .auth-toggle-btn {
      background: none;
      border: 1px solid #333;
      color: #6366f1;
      font-size: 12px;
      padding: 4px 10px;
      width: auto;
      border-radius: 4px;
      cursor: pointer;
    }
    .auth-toggle-btn:hover {
      border-color: #6366f1;
      background: rgba(99, 102, 241, 0.08);
    }
    .auth-form-wrapper {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.2s ease-out;
    }
    .auth-form-wrapper.open {
      max-height: 200px;
    }
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 10px;
    }
    .auth-form input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #0f0f0f;
      color: #e0e0e0;
      font-size: 13px;
      outline: none;
    }
    .auth-form input:focus {
      border-color: #6366f1;
    }
    .auth-form label {
      font-size: 12px;
      color: #888;
      margin-bottom: -4px;
    }
    .auth-error {
      font-size: 12px;
      color: #f87171;
      min-height: 16px;
    }
    .btn-logout {
      background: none;
      border: 1px solid #333;
      color: #888;
      font-size: 12px;
      padding: 4px 10px;
      width: auto;
      border-radius: 4px;
    }
    .btn-logout:hover {
      color: #f87171;
      border-color: #f87171;
    }

    .actions {
      margin-top: 16px;
      display: flex;
      gap: 8px;
    }
    button {
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary {
      background: #6366f1;
      color: white;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-secondary {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      color: #ccc;
      flex: 1;
    }
    .progress-text {
      font-size: 12px;
      color: #6366f1;
      text-align: center;
      margin-top: 8px;
      min-height: 16px;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }
    .footer a {
      font-size: 12px;
      color: #666;
      text-decoration: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .footer a:hover {
      color: #999;
    }
    /* Sync-window read-only note (#120) -- the popup stays a status view, not
       a settings form: the current window is shown here for context, with
       the existing "Settings" link as the one place to change it. */
    #sync-window-note {
      font-size: 11px;
      color: #555;
    }
    .first-run-hint {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      background: rgba(99, 102, 241, 0.07);
      border: 1px solid rgba(99, 102, 241, 0.15);
      border-radius: 8px;
      padding: 8px 10px;
      margin-top: 8px;
      font-size: 11px;
      color: #999;
      line-height: 1.5;
    }
    .dismiss-hint-btn {
      background: none;
      border: none;
      color: #555;
      font-size: 16px;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      flex-shrink: 0;
      width: auto;
    }
    .dismiss-hint-btn:hover {
      color: #888;
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Membral</h1>
    <div class="tagline">Your AI conversations, unified</div>
  </div>

  <div id="providers"></div>

  <div class="actions">
    <button id="sync-all-btn" class="btn-primary"><span style="font-size:15px;">&#8635;</span> Sync All Now</button>
    <button id="export-btn" class="btn-secondary">Export</button>
    <button id="cancel-sync-btn" class="btn-secondary" style="display:none; flex:0 0 auto; color:#f87171;">Cancel</button>
  </div>

  <div id="progress" class="progress-text"></div>

  <!-- Auth Section — compact bar, form expands on click -->
  <div id="auth-section" class="auth-section">
    <div id="auth-logged-out" style="display:none;">
      <div class="auth-bar">
        <div class="auth-bar-left">
          <span class="status-dot" style="background:#4ade80;"></span>
          <span style="color:#aaa;">Local sync active</span>
        </div>
        <button id="auth-toggle-btn" class="auth-toggle-btn">Sign in to sync to cloud &#9658;</button>
      </div>
      <div id="auth-form-wrapper" class="auth-form-wrapper">
        <div class="auth-form">
          <input type="email" id="auth-email" placeholder="Email" autocomplete="email" />
          <input type="password" id="auth-password" placeholder="Password" autocomplete="current-password" />
          <button id="auth-login-btn" class="btn-primary" style="padding:8px;">Sign In</button>
          <div id="auth-error" class="auth-error"></div>
        </div>
      </div>
    </div>
    <!-- Logged-in state: compact bar -->
    <div id="auth-logged-in" style="display:none;">
      <div class="auth-bar">
        <div class="auth-bar-left">
          <span class="status-dot" style="background:#4ade80;"></span>
          <span id="auth-user-email" class="auth-email"></span>
          <span id="auth-sync-status" style="font-size:11px;color:#666;"></span>
        </div>
        <button id="auth-logout-btn" class="btn-logout">Sign Out</button>
      </div>
    </div>
  </div>

  <div id="first-run-hint" class="first-run-hint" style="display:none;">
    <span>Open <strong style="color:#e0e0e0;">ChatGPT</strong> or <strong style="color:#e0e0e0;">Claude.ai</strong> while signed in, then click <strong style="color:#6366f1;">Sync All Now</strong> to start importing</span>
    <button id="dismiss-hint-btn" class="dismiss-hint-btn" aria-label="Dismiss">&#215;</button>
  </div>

  <div class="footer">
    <span id="sync-window-note"></span>
    <a id="settings-link">&#9881; Settings</a>
  </div>

  <script type="module" src="popup.ts"></script>
</body>
</html>
