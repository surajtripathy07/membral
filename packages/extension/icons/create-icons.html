<!DOCTYPE html>
<html>
<head><title>Generate Membral Icons</title></head>
<body>
<p>Open this file in a browser, right-click each canvas, and "Save image as" to create the icon PNGs.</p>
<canvas id="c16" width="16" height="16"></canvas>
<canvas id="c48" width="48" height="48"></canvas>
<canvas id="c128" width="128" height="128"></canvas>
<script>
function drawIcon(canvas) {
  const s = canvas.width;
  const ctx = canvas.getContext('2d');
  // Background
  ctx.fillStyle = '#3b82f6';
  ctx.beginPath();
  ctx.roundRect(0, 0, s, s, s * 0.2);
  ctx.fill();
  // Sync arrows symbol
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = Math.max(1, s * 0.08);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  const cx = s / 2, cy = s / 2, r = s * 0.28;
  // Top arc
  ctx.beginPath();
  ctx.arc(cx, cy, r, -Math.PI * 0.8, -Math.PI * 0.2);
  ctx.stroke();
  // Arrow head top
  const ax = cx + r * Math.cos(-Math.PI * 0.2);
  const ay = cy + r * Math.sin(-Math.PI * 0.2);
  ctx.beginPath();
  ctx.moveTo(ax - s*0.08, ay - s*0.06);
  ctx.lineTo(ax, ay);
  ctx.lineTo(ax - s*0.02, ay + s*0.08);
  ctx.stroke();
  // Bottom arc
  ctx.beginPath();
  ctx.arc(cx, cy, r, Math.PI * 0.2, Math.PI * 0.8);
  ctx.stroke();
  // Arrow head bottom
  const bx = cx + r * Math.cos(Math.PI * 0.8);
  const by = cy + r * Math.sin(Math.PI * 0.8);
  ctx.beginPath();
  ctx.moveTo(bx + s*0.08, by + s*0.06);
  ctx.lineTo(bx, by);
  ctx.lineTo(bx + s*0.02, by - s*0.08);
  ctx.stroke();
}
drawIcon(document.getElementById('c16'));
drawIcon(document.getElementById('c48'));
drawIcon(document.getElementById('c128'));
</script>
</body>
</html>
